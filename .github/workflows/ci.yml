name: CI
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Mesh checks
        run: node tests/check_mesh.js
      - name: Photo checks
        run: node tests/check_photo.js
      - name: index.html matches the sources
        run: python3 build.py --check
